# Prod stack:  docker compose -f docker-compose.prod.yml up --build
# nginx reverse-proxies the API on http://localhost (port 80). The `web`
# (Next.js) service is opt-in via `--profile full` — in the real deployment
# the frontend is hosted on Vercel, not on this stack, so it's excluded by
# default (also matters on a 1GB e2-micro: running web here too risks OOM).
# All secrets below must be supplied via a .env file next to this file —
# there are no hardcoded fallbacks for real secrets, so a missing value
# fails the container start loudly rather than silently using a dev value.

# distinct project name: `down` on this file must never remove the dev
# stack's postgres/redis (same service names, same directory)
name: seatsure-prod

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seatsure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: seatsure
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatsure -d seatsure']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: sh -c "cd /repo/apps/api && npx prisma migrate deploy && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://seatsure:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/seatsure
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@seatsure.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seatsure:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/seatsure?connection_limit=30&pool_timeout=30
      # No auth on the redis:7-alpine container above (not secret-bearing)
      # and the in-network hostname never varies by environment, so this
      # is intentionally NOT ${}-substituted — avoids colliding with a
      # host-side REDIS_URL (e.g. redis://localhost:6379) some .env files
      # set for app-level dev use outside the compose network.
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      API_PORT: '3001'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Local all-in-one preview only — opt in with `--profile full`. Not part
  # of the VM deployment (Vercel hosts the frontend there).
  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: '' # same origin — nginx routes API paths
    environment:
      API_URL_INTERNAL: http://api:3001 # SSR inside the compose network
    ports:
      - '3000:3000' # direct access for local full-stack preview
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata_prod:
