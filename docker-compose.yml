services:
  postgres:
    image: postgres:16
    container_name: seatsure-postgres
    environment:
      POSTGRES_USER: seatsure
      POSTGRES_PASSWORD: seatsure
      POSTGRES_DB: seatsure
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatsure -d seatsure']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seatsure-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
