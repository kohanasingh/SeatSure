worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Spec §9: 30 requests/minute per IP on API routes, burst 20
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_status 429;

  upstream api {
    server api:3001;
  }

  server {
    listen 80;

    # Certbot webroot challenge — must be reachable over plain HTTP,
    # so this is matched before the HTTPS redirect below.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # ---- everything else: send to HTTPS ----
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;

    ssl_certificate     /etc/letsencrypt/live/seatsure.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seatsure.duckdns.org/privkey.pem;

    # ---- API routes ----
    location ~ ^/(auth|trpc|webhooks)(/|$) {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|ready)$ {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    # Socket.io long-lived connections — no rate limit, websocket upgrade
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 600s;
    }

    # ---- everything else ----
    # The frontend is hosted on Vercel in production, not behind this
    # nginx — this stack only reverse-proxies the API.
    location / {
      return 404;
    }
  }
}
