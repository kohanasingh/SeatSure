worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Spec §9: 30 requests/minute per IP on API routes, burst 20
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_status 429;

  # Docker's embedded DNS. Using it with a $-variable in proxy_pass (below)
  # resolves "api" lazily, per-request — unlike a static `upstream { server
  # api:3001; }` block, which resolves once at nginx startup and treats a
  # miss as fatal.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;

    ssl_certificate     /etc/letsencrypt/live/seatsure.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seatsure.duckdns.org/privkey.pem;

    location ~ ^/(auth|trpc|webhooks)(/|$) {
      limit_req zone=api burst=20 nodelay;
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|ready)$ {
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
    }

    location /socket.io/ {
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 600s;
    }

    location / {
      return 404;
    }
  }
}
